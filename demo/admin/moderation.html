<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comment Moderation - The Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .comment-card {
      background: rgba(26, 26, 26, 0.8);
      border: 2px solid #333;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 15px;
    }
    
    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }
    
    .comment-meta {
      color: #888;
      font-size: 0.9em;
    }
    
    .comment-text {
      margin: 15px 0;
      line-height: 1.8;
      color: #e0e0e0;
    }
    
    .comment-actions {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    
    .comment-actions button {
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      font-family: inherit;
      font-size: 0.9em;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .btn-approve {
      background: #00aa00;
      color: #fff;
    }
    
    .btn-approve:hover {
      background: #00cc00;
    }
    
    .btn-delete {
      background: #aa0000;
      color: #fff;
    }
    
    .btn-delete:hover {
      background: #cc0000;
    }
    
    .btn-highlight {
      background: #aa8800;
      color: #fff;
    }
    
    .btn-highlight:hover {
      background: #ccaa00;
    }
    
    .filter-bar {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }
    
    .filter-bar select {
      padding: 10px;
      background: #1a1a1a;
      color: #e0e0e0;
      border: 2px solid #333;
      border-radius: 5px;
      font-family: inherit;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="admin-container">
    <div class="admin-header">
      <h1>🔍 COMMENT MODERATION</h1>
      <div class="status-indicator">
        <a href="dashboard.html" class="action-btn" style="margin-right: 15px;">← Dashboard</a>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </div>

    <!-- Filter Bar -->
    <div class="section">
      <h2>FILTERS</h2>
      <div class="filter-bar">
        <select id="project-filter">
          <option value="all">All Projects</option>
          <option value="retro_tv">Retro TV</option>
          <option value="streetlight_lantern">Streetlight Lantern</option>
          <option value="graffiti_wall">Graffiti Wall</option>
          <option value="cafe_chat">Café Chat</option>
          <option value="police_scanner">Police Scanner</option>
          <option value="town_podium">Town Podium</option>
          <option value="documentary_room">Documentary Room</option>
        </select>
        
        <select id="sort-filter">
          <option value="newest">Newest First</option>
          <option value="oldest">Oldest First</option>
        </select>
        
        <input type="text" id="search-filter" placeholder="Search comments..." style="flex: 1; padding: 10px; background: #1a1a1a; color: #e0e0e0; border: 2px solid #333; border-radius: 5px; font-family: inherit;">
      </div>
    </div>

    <!-- Comments List -->
    <div class="section">
      <h2>COMMENTS (<span id="comment-count">0</span>)</h2>
      <div id="comments-container"></div>
    </div>
  </div>

  <script src="js/admin-auth.js"></script>
  <script>
    const STORAGE_PREFIX = 'homeless_speaker_';
    const PROJECT_KEYS = {
      'retro_tv': 'Retro TV',
      'streetlight_lantern': 'Streetlight Lantern',
      'graffiti_wall': 'Graffiti Wall',
      'cafe_chat': 'Café Chat',
      'police_scanner': 'Police Scanner',
      'town_podium': 'Town Podium',
      'documentary_room': 'Documentary Room'
    };

    function getAllComments() {
      const allComments = [];
      Object.keys(PROJECT_KEYS).forEach(key => {
        const data = localStorage.getItem(STORAGE_PREFIX + key);
        if (data) {
          const comments = JSON.parse(data);
          comments.forEach(comment => {
            allComments.push({
              ...comment,
              projectKey: key,
              projectName: PROJECT_KEYS[key]
            });
          });
        }
      });
      return allComments;
    }

    function deleteComment(projectKey, commentId) {
      if (!confirm('Are you sure you want to delete this comment?')) return;
      
      const data = localStorage.getItem(STORAGE_PREFIX + projectKey);
      if (data) {
        let comments = JSON.parse(data);
        comments = comments.filter(c => c.id !== commentId);
        localStorage.setItem(STORAGE_PREFIX + projectKey, JSON.stringify(comments));
        renderComments();
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function formatTime(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleString();
    }

    function renderComments() {
      let comments = getAllComments();
      const projectFilter = document.getElementById('project-filter').value;
      const sortFilter = document.getElementById('sort-filter').value;
      const searchFilter = document.getElementById('search-filter').value.toLowerCase();

      // Apply filters
      if (projectFilter !== 'all') {
        comments = comments.filter(c => c.projectKey === projectFilter);
      }

      if (searchFilter) {
        comments = comments.filter(c => 
          c.text.toLowerCase().includes(searchFilter) ||
          c.name.toLowerCase().includes(searchFilter)
        );
      }

      // Apply sort
      if (sortFilter === 'newest') {
        comments.sort((a, b) => b.timestamp - a.timestamp);
      } else {
        comments.sort((a, b) => a.timestamp - b.timestamp);
      }

      const container = document.getElementById('comments-container');
      document.getElementById('comment-count').textContent = comments.length;

      if (comments.length === 0) {
        container.innerHTML = '<p style="color: #888; text-align: center; padding: 40px;">No comments found</p>';
        return;
      }

      container.innerHTML = comments.map(comment => `
        <div class="comment-card">
          <div class="comment-header">
            <div>
              <strong>${escapeHtml(comment.name)}</strong>
              <div class="comment-meta">
                ${comment.projectName} • ${formatTime(comment.timestamp)}
              </div>
            </div>
            <span class="badge badge-active">Active</span>
          </div>
          <div class="comment-text">${escapeHtml(comment.text)}</div>
          <div class="comment-actions">
            <button class="btn-delete" onclick="deleteComment('${comment.projectKey}', ${comment.id})">
              🗑️ Delete
            </button>
            <button class="btn-highlight">⭐ Highlight</button>
          </div>
        </div>
      `).join('');
    }

    document.addEventListener('DOMContentLoaded', function() {
      renderComments();

      document.getElementById('project-filter').addEventListener('change', renderComments);
      document.getElementById('sort-filter').addEventListener('change', renderComments);
      document.getElementById('search-filter').addEventListener('input', renderComments);
    });
  </script>
</body>
</html>
